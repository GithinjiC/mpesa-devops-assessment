services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\" -p \"${POSTGRES_INTERNAL_PORT}\"",
        ]
      interval: 3s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:${POSTGRES_INTERNAL_PORT}/${POSTGRES_DB}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:?set NGINX_HOST_PORT in .env}:${NGINX_CONTAINER_HTTP_PORT:?set NGINX_CONTAINER_HTTP_PORT in .env}"
    env_file:
      - .env
    environment:
      NGINX_UPSTREAM_HOST: ${NGINX_UPSTREAM_HOST:?set NGINX_UPSTREAM_HOST in .env}
      NGINX_UPSTREAM_PORT: ${PORT:?set PORT in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - app

volumes:
  pgdata:
